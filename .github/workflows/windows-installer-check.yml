name: Windows installer verification

on:
  push:
    branches: [test/windows-installer-a0b5aa2]

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.shell }} / ${{ matrix.link_mode }}
    runs-on: windows-2022
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
        link_mode: [native, fallback]
    steps:
      - name: Exercise the pinned installer on Windows
        shell: pwsh
        env:
          TEST_REVISION: ${{ github.sha }}
          TEST_SHELL: ${{ matrix.shell }}
          LINK_MODE: ${{ matrix.link_mode }}
        run: |
          $testPath = Join-Path $env:RUNNER_TEMP "check-installer.ps1"
          @'
          $ErrorActionPreference = "Stop"
          Write-Host "PowerShell $($PSVersionTable.PSVersion); link mode: $env:LINK_MODE"
          function Assert-True {
              param([bool]$Condition, [string]$Message)
              if (-not $Condition) { throw $Message }
          }
          $sourceRepo = Join-Path $env:RUNNER_TEMP "source repo"
          git clone --quiet --no-checkout https://github.com/schalk-conradie/skills.git $sourceRepo
          if ($LASTEXITCODE -ne 0) { throw "Source clone failed" }
          git -C $sourceRepo checkout --quiet $env:TEST_REVISION
          if ($LASTEXITCODE -ne 0) { throw "Pinned checkout failed" }
          $installer = Join-Path $sourceRepo "install.ps1"
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($installer, [ref]$tokens, [ref]$parseErrors) > $null
          Assert-True ($parseErrors.Count -eq 0) "Installer parse errors: $parseErrors"

          $installRoot = Join-Path $HOME "installed agents test"
          $codexRoot = Join-Path $HOME ".codex"
          $claudeRoot = Join-Path $HOME ".claude"
          foreach ($harnessRoot in @($codexRoot, $claudeRoot)) {
              Assert-True (-not (Test-Path -LiteralPath $harnessRoot)) "Expected a clean runner: $harnessRoot exists"
              New-Item -ItemType Directory -Path $harnessRoot | Out-Null
          }
          if ($env:LINK_MODE -eq "fallback") {
              # Simulate denied symbolic-link privileges; hard links and junctions are real NTFS operations.
              function New-Item {
                  [CmdletBinding()]
                  param([string]$ItemType, [string]$Path, [string]$Target, [switch]$Force)
                  if ($ItemType -eq "SymbolicLink") { throw "Test: symbolic-link privilege unavailable" }
                  Microsoft.PowerShell.Management\New-Item @PSBoundParameters
              }
          }
          & $installer -RepoUrl $sourceRepo -AgentsDir $installRoot
          $installedHead = git -C $installRoot rev-parse HEAD
          Assert-True ($installedHead -eq $env:TEST_REVISION) "Wrong installed revision"
          $expectedFileType = if ($env:LINK_MODE -eq "fallback") { "HardLink" } else { "SymbolicLink" }
          $expectedDirectoryType = if ($env:LINK_MODE -eq "fallback") { "Junction" } else { "SymbolicLink" }
          foreach ($instructionPath in @((Join-Path $codexRoot "AGENTS.md"), (Join-Path $claudeRoot "CLAUDE.md"))) {
              Assert-True ((Get-Item -LiteralPath $instructionPath).LinkType -eq $expectedFileType) "Unexpected file link: $instructionPath"
              Assert-True ((Get-FileHash $instructionPath).Hash -eq (Get-FileHash (Join-Path $installRoot "AGENTS.md")).Hash) "Instruction contents differ"
          }
          $personalSkills = Join-Path $installRoot "skills/personal"
          $skillDirectories = @(Get-ChildItem -LiteralPath $personalSkills -Directory | Where-Object { Test-Path (Join-Path $_.FullName "SKILL.md") })
          Assert-True ($skillDirectories.Count -gt 0) "No skills were tested"
          foreach ($skill in $skillDirectories) {
              foreach ($linkedRoot in @((Join-Path $installRoot "skills"), (Join-Path $claudeRoot "skills"))) {
                  $linkedSkill = Join-Path $linkedRoot $skill.Name
                  Assert-True ((Get-Item -LiteralPath $linkedSkill).LinkType -eq $expectedDirectoryType) "Unexpected directory link: $linkedSkill"
                  Assert-True ((Get-FileHash (Join-Path $linkedSkill "SKILL.md")).Hash -eq (Get-FileHash (Join-Path $skill.FullName "SKILL.md")).Hash) "Skill content differs: $linkedSkill"
              }
          }
          Assert-True (-not (Test-Path (Join-Path $codexRoot "agents"))) "Installer created custom agents"
          Write-Host "PASS: clean clone, instruction links, skill links, and no custom agents"

          $markerPath = Join-Path $installRoot "local-marker.txt"
          Set-Content -LiteralPath $markerPath -Value "preserve-local-work"
          $legacySource = Join-Path $installRoot "agents"
          New-Item -ItemType Directory -Path $legacySource | Out-Null
          Set-Content -LiteralPath (Join-Path $legacySource "legacy.toml") -Value 'name = "legacy"'
          & $installer -RepoUrl $sourceRepo -AgentsDir $installRoot
          Assert-True ((Get-Content -LiteralPath $markerPath -Raw).Trim() -eq "preserve-local-work") "Rerun discarded local work"
          Assert-True (-not (Test-Path (Join-Path $codexRoot "agents"))) "Rerun installed a legacy custom agent"
          Assert-True (@(Get-ChildItem $codexRoot -Filter "*.backup.*").Count -eq 0) "Rerun backed up correct links"
          Write-Host "PASS: idempotent rerun preserves local work and ignores legacy worker definitions"

          $conflictPath = Join-Path $codexRoot "AGENTS.md"
          Remove-Item -LiteralPath $conflictPath -Force
          Set-Content -LiteralPath $conflictPath -Value "preserve-conflict"
          $conflictRejected = $false
          try { & $installer -RepoUrl $sourceRepo -AgentsDir $installRoot }
          catch {
              if ($_.Exception.Message -notlike "*already exists*") { throw }
              $conflictRejected = $true
          }
          Assert-True $conflictRejected "A conflicting file was silently replaced"
          Assert-True ((Get-Content -LiteralPath $conflictPath -Raw).Trim() -eq "preserve-conflict") "Conflicting contents changed"
          & $installer -RepoUrl $sourceRepo -AgentsDir $installRoot -Force
          $backups = @(Get-ChildItem -LiteralPath $codexRoot -Filter "AGENTS.md.backup.*")
          Assert-True ($backups.Count -eq 1) "Expected one conflict backup"
          Assert-True ((Get-Content -LiteralPath $backups[0].FullName -Raw).Trim() -eq "preserve-conflict") "Conflict backup content differs"
          Assert-True ((Get-Item -LiteralPath $conflictPath).LinkType -eq $expectedFileType) "Conflict was not replaced with the expected link"
          Write-Host "PASS: conflict refusal and explicit force backup"

          $outsideSkill = Join-Path $env:RUNNER_TEMP "unrelated skill"
          New-Item -ItemType Directory -Path $outsideSkill | Out-Null
          Set-Content -LiteralPath (Join-Path $outsideSkill "SKILL.md") -Value "external-skill"
          $unrelatedLink = Join-Path (Join-Path $claudeRoot "skills") "external-test"
          Microsoft.PowerShell.Management\New-Item -ItemType Junction -Path $unrelatedLink -Target $outsideSkill | Out-Null
          $removedSkill = $skillDirectories[0]
          Remove-Item -LiteralPath (Join-Path $removedSkill.FullName "SKILL.md") -Force
          & $installer -RepoUrl $sourceRepo -AgentsDir $installRoot
          foreach ($linkedRoot in @((Join-Path $installRoot "skills"), (Join-Path $claudeRoot "skills"))) {
              Assert-True (-not (Test-Path -LiteralPath (Join-Path $linkedRoot $removedSkill.Name))) "Stale skill link remains"
          }
          Assert-True (Test-Path -LiteralPath $unrelatedLink) "Unrelated skill link was deleted"
          Assert-True (Test-Path -LiteralPath $removedSkill.FullName) "Stale cleanup deleted the source directory"
          Write-Host "PASS: stale skill cleanup preserves unrelated links and source directories"
          Write-Host "ALL WINDOWS INSTALLER CHECKS PASSED"
          '@ | Set-Content -LiteralPath $testPath -Encoding UTF8
          & $env:TEST_SHELL -NoProfile -NonInteractive -File $testPath
          if ($LASTEXITCODE -ne 0) { throw "Installer checks failed with exit code $LASTEXITCODE" }
